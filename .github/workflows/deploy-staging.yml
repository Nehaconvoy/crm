name: Deploy to Staging

# Deploys the devN branch to Staging on every push.
#
# This job connects to the staging server using the configured SSH secrets.
on:
  push:
    branches: [devN]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy devN -> Staging
    runs-on: ubuntu-latest

    environment:
      name: staging
      url: https://stagingcci.in

    env:
      DEPLOY_PATH: ${{ secrets.STAGING_PATH || vars.DEPLOY_PATH }}
      WEB_ROOT: ${{ vars.WEB_ROOT || format('{0}/public', secrets.STAGING_PATH || vars.DEPLOY_PATH) }}
      DEPLOY_BRANCH: devN
      PHP_BIN: ${{ vars.PHP_BIN }}
      COMPOSER_BIN: ${{ vars.COMPOSER_BIN }}
      # Token used ON THE SERVER to fetch the private repo over HTTPS.
      # Prefers a dedicated deploy PAT; falls back to the workflow token.
      GH_DEPLOY_TOKEN: ${{ secrets.GH_DEPLOY_TOKEN || github.token }}

    steps:
      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.STAGING_USERNAME || secrets.SSH_USER }}
          port: 65002
          key: ${{ secrets.STAGING_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.STAGING_SSH_PASSPHRASE || secrets.SSH_KEY_PASSPHRASE }}
          timeout: 60s
          command_timeout: 30m
          debug: true
          envs: DEPLOY_PATH,WEB_ROOT,DEPLOY_BRANCH,PHP_BIN,COMPOSER_BIN,GH_DEPLOY_TOKEN
          script: |
            set -euo pipefail

            PHP_BIN="${PHP_BIN:-php}"
            COMPOSER_BIN="${COMPOSER_BIN:-composer}"
            DEPLOY_PATH="${DEPLOY_PATH:-/home/u698476407/domains/stagingcci.in/crm_app}"
            WEB_ROOT="${WEB_ROOT:-${DEPLOY_PATH}/public}"
            DEPLOY_BRANCH="${DEPLOY_BRANCH:-devN}"

            if [[ -z "${GH_DEPLOY_TOKEN:-}" ]]; then
              echo "ERROR: GH_DEPLOY_TOKEN is empty. Add a GH_DEPLOY_TOKEN secret (a PAT with read access to the repo)."
              exit 1
            fi

            # Authenticated HTTPS URL so the private repo can be fetched non-interactively.
            AUTH_REMOTE="https://x-access-token:${GH_DEPLOY_TOKEN}@github.com/amrentech1230/crm.git"
            PLAIN_REMOTE="https://github.com/amrentech1230/crm.git"

            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"

            if [[ ! -d .git ]]; then
              git init
            fi

            # Set/refresh origin idempotently (works whether or not origin already exists).
            if git remote get-url origin >/dev/null 2>&1; then
              git remote set-url origin "$AUTH_REMOTE"
            else
              git remote add origin "$AUTH_REMOTE"
            fi

            # Make sure the token is never persisted in the repo config after this run.
            trap 'git remote set-url origin "$PLAIN_REMOTE" || true' EXIT

            git fetch --all --prune
            git reset --hard "origin/$DEPLOY_BRANCH"
            echo "Deployed commit: $(git rev-parse HEAD)"

            # Scrub the token from origin now that fetch is done.
            git remote set-url origin "$PLAIN_REMOTE"

            $COMPOSER_BIN install --no-interaction --prefer-dist --optimize-autoloader --no-dev
            $PHP_BIN artisan down --retry=15 || true
            trap '$PHP_BIN artisan up || true' EXIT
            $PHP_BIN artisan migrate --force
            $PHP_BIN artisan optimize:clear
            $PHP_BIN artisan config:cache
            $PHP_BIN artisan event:cache
            $PHP_BIN artisan view:cache

            if [[ ! -f "${WEB_ROOT}/index.php" ]]; then
              echo "WEB_ROOT does not contain public/index.php: ${WEB_ROOT}"
              exit 1
            fi

            printf '%s\n' "$(git rev-parse HEAD)" > "${WEB_ROOT}/deploy-sha.txt"
            $PHP_BIN artisan up
            trap - EXIT
